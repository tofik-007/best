<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EcoGlow Lamp — 3D</title>
<style>
  html,body{margin:0;height:100%;background:#0b0b0b;color:#fff;font-family:monospace;overflow:hidden;}
  #label{
    position:fixed; top:16px; left:0; right:0; text-align:center;
    letter-spacing:.2em; font-size:12px; color:#4ade80; z-index:10;
  }
  #hint{
    position:fixed; bottom:18px; left:0; right:0; text-align:center;
    font-size:11px; color:#9ca3af; z-index:10;
  }
  #status{
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    font-size:12px; color:#6b7280; z-index:5;
  }
  canvas{display:block; cursor:grab;}
  canvas.hoverable{cursor:pointer;}

  #controls{
    position:fixed; top:52px; right:16px; z-index:10;
    display:flex; flex-direction:column; gap:8px;
  }
  #controls button{
    background:#111827; color:#4ade80; border:1px solid #22c55e;
    border-radius:6px; padding:6px 10px; font-family:monospace;
    font-size:11px; cursor:pointer;
  }
  #controls button.off{ color:#6b7280; border-color:#374151; }

  #infocard{
    position:fixed; left:50%; bottom:56px; transform:translateX(-50%) translateY(10px);
    max-width:280px; width:80%;
    background:#111827; border:1px solid #22c55e; border-radius:10px;
    padding:14px 16px; z-index:20;
    opacity:0; pointer-events:none;
    transition:opacity .18s ease, transform .18s ease;
  }
  #infocard.show{ opacity:1; pointer-events:auto; transform:translateX(-50%) translateY(0); }
  #infocard h4{ margin:0 0 6px; font-size:13px; color:#4ade80; letter-spacing:.05em; }
  #infocard p{ margin:0; font-size:12px; line-height:1.5; color:#9ca3af; }
  #infocard button{
    position:absolute; top:6px; right:8px; background:none; border:none;
    color:#6b7280; font-size:13px; cursor:pointer;
  }
</style>
</head>
<body>
<div id="label">ECOGLOW LAMP · 3D</div>
<div id="status">loading…</div>
<div id="hint">drag to rotate · scroll to zoom · tap a part to learn more</div>

<div id="controls">
  <button id="btn-rotate">⏸ auto-rotate</button>
  <button id="btn-light">💡 LED on</button>
</div>

<div id="infocard">
  <button onclick="closeInfo()">✕</button>
  <h4 id="info-title"></h4>
  <p id="info-body"></p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
window.addEventListener('load', function(){
  const statusEl = document.getElementById('status');
  if(typeof THREE === 'undefined'){
    statusEl.textContent = 'could not load 3D library — check connection';
    return;
  }
  statusEl.remove();

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b0b0b);

  const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 100);
  camera.position.set(3.4, 2.6, 4.4);

  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  document.body.appendChild(renderer.domElement);

  let controls;
  if(THREE.OrbitControls){
    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 1.4;
    controls.minDistance = 2.5;
    controls.maxDistance = 9;
    controls.target.set(0, 1.0, 0);
  }

  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const key = new THREE.DirectionalLight(0xffffff, 1.0);
  key.position.set(4, 6, 3);
  scene.add(key);
  const fill = new THREE.DirectionalLight(0x88aaff, 0.3);
  fill.position.set(-4, 2, -3);
  scene.add(fill);

  const lamp = new THREE.Group();
  const info = {
    solar: {title:"Solar panel", body:"Folding photovoltaic panel that charges the battery from daylight. A row of small LED bulbs on its underside is the actual light source, shining down onto your desk."},
    thermo: {title:"Thermoelectric module", body:"Set into a window cut in the front of the wooden arm. It absorbs body heat from your hand and converts it into electricity."},
    base: {title:"Base & battery", body:"Houses the battery, charging circuit, and display electronics."},
    display: {title:"Display", body:"Shows time and battery level, controlled by the buttons beside it."},
    arm: {title:"Support arm", body:"Wooden arm connecting the base to the solar panel head."}
  };

  const woodMat = new THREE.MeshStandardMaterial({color:0xc9a876, roughness:0.7});
  const darkMat = new THREE.MeshStandardMaterial({color:0x1a1a1a, roughness:0.5, metalness:0.2});
  const base = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.5, 1.1), woodMat);
  base.position.set(0, 0.25, 0);
  base.userData.key = 'base';
  lamp.add(base);

  const tray = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.08, 0.9), darkMat);
  tray.position.set(0, 0.54, 0);
  tray.userData.key = 'base';
  lamp.add(tray);

  const dispMat = new THREE.MeshStandardMaterial({color:0x0a2e22, emissive:0x1d9e75, emissiveIntensity:0.5});

  // ---- display: bezel frame + a canvas-rendered screen (time + battery) ----
  function makeScreenTexture(){
    const canvas = document.createElement('canvas');
    canvas.width = 256; canvas.height = 96;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 42px monospace';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText('10:30', 14, 48);
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 4;
    ctx.strokeRect(150, 32, 62, 26);
    ctx.fillRect(212, 40, 5, 10);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(154, 36, 44, 18);
    ctx.fillStyle = '#000000';
    ctx.font = 'bold 13px monospace';
    ctx.fillText('75%', 158, 46);
    return new THREE.CanvasTexture(canvas);
  }
  const screenMat = new THREE.MeshBasicMaterial({map: makeScreenTexture()});
  const display = new THREE.Mesh(new THREE.PlaneGeometry(0.55, 0.2), screenMat);
  display.rotation.x = -Math.PI / 2;
  display.position.set(0.35, 0.585, 0.2);
  display.userData.key = 'display';
  lamp.add(display);

  const bezelMat = new THREE.MeshStandardMaterial({color:0x111111, roughness:0.5});
  const bezel = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.02, 0.24), bezelMat);
  bezel.position.set(0.35, 0.57, 0.2);
  bezel.userData.key = 'display';
  lamp.add(bezel);

  const btnMat = new THREE.MeshStandardMaterial({color:0x2f7a2f, roughness:0.4, metalness:0.3});
  [0.08, 0.20].forEach((zOff, i) => {
    const knob = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.02, 20), btnMat);
    knob.position.set(0.7, 0.575, 0.0 + zOff * (i===0?1:-1));
    knob.userData.key = 'display';
    lamp.add(knob);
  });

  const boardMat = new THREE.MeshStandardMaterial({color:0x1c4d17, roughness:0.75});
  const board = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.02, 0.4), boardMat);
  board.position.set(-0.4, 0.58, -0.1);
  board.userData.key = 'base';
  lamp.add(board);

  const chipMat = new THREE.MeshStandardMaterial({color:0x111111, roughness:0.4});
  [[-0.5,-0.05],[-0.32,0.02],[-0.42,-0.2]].forEach(([x,z]) => {
    const chip = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.025, 0.08), chipMat);
    chip.position.set(x, 0.6, z);
    chip.userData.key = 'base';
    lamp.add(chip);
  });
  const capacitorMat = new THREE.MeshStandardMaterial({color:0x888888, metalness:0.6, roughness:0.3});
  const capacitor = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.06, 12), capacitorMat);
  capacitor.position.set(-0.2, 0.6, -0.15);
  capacitor.userData.key = 'base';
  lamp.add(capacitor);

  // ---- power switch, opposite side of the base from the display ----
  const switchMat = new THREE.MeshStandardMaterial({color:0x2a2a2a, roughness:0.4, metalness:0.4});
  const switchBase = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.02, 0.14), switchMat);
  switchBase.position.set(-0.75, 0.565, 0.2);
  switchBase.userData.key = 'base';
  lamp.add(switchBase);

  const toggleMat = new THREE.MeshStandardMaterial({color:0x2f7a2f, roughness:0.35, metalness:0.4, emissive:0x0f3d18, emissiveIntensity:0.5});
  const toggle = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.05, 20), toggleMat);
  toggle.rotation.x = Math.PI / 2;
  toggle.position.set(-0.75, 0.6, 0.2);
  toggle.userData.key = 'base';
  lamp.add(toggle);

  const armMat = new THREE.MeshStandardMaterial({color:0xd8bb8f, roughness:0.65});
  const arm = new THREE.Mesh(new THREE.BoxGeometry(0.28, 1.55, 0.22), armMat);
  arm.position.set(-0.55, 1.32, -0.1);
  arm.rotation.z = THREE.MathUtils.degToRad(-14);
  arm.userData.key = 'arm';
  lamp.add(arm);

  const armDisp = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.9, 0.02), new THREE.MeshStandardMaterial({color:0x0c2a4a, emissive:0x1a5fa0, emissiveIntensity:0.5}));
  armDisp.position.set(-0.5, 1.3, 0.01);
  armDisp.rotation.z = THREE.MathUtils.degToRad(-14);
  armDisp.userData.key = 'arm';
  armDisp.visible = false;
  lamp.add(armDisp);

  // thermoelectric module: flat recessed plate on the arm's front face, like a window cut into the wood
  const thermoMat = new THREE.MeshStandardMaterial({color:0x2f5fa8, roughness:0.3, metalness:0.4, emissive:0x123a6e, emissiveIntensity:0.3});
  const thermoPlate = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.75, 0.03), thermoMat);
  thermoPlate.position.set(0, 0.1, 0.115);
  thermoPlate.userData.key = 'thermo';
  arm.add(thermoPlate);

  const panelGroup = new THREE.Group();
  const panelMat = new THREE.MeshStandardMaterial({color:0x0d1520, roughness:1, metalness:0});
  const panelBody = new THREE.Mesh(new THREE.BoxGeometry(2.3, 0.12, 1.05), panelMat);
  panelBody.position.y = 0.02;
  panelBody.userData.key = 'solar';
  panelGroup.add(panelBody);

  const gridMat = new THREE.LineBasicMaterial({color:0x3b82f6});
  for(let i=-2;i<=2;i++){
    const pts = [new THREE.Vector3(i*0.42, 0.09, -0.5), new THREE.Vector3(i*0.42, 0.09, 0.5)];
    panelGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), gridMat));
  }
  const outline = new THREE.Mesh(new THREE.BoxGeometry(2.34, 0.14, 1.09), new THREE.MeshStandardMaterial({color:0xf5f1e8, roughness:0.6}));
  outline.position.y = -0.005;
  outline.userData.key = 'solar';
  outline.visible = false;
  panelGroup.add(outline);

  panelGroup.position.set(-0.1, 2.35, -0.1);
  panelGroup.rotation.z = THREE.MathUtils.degToRad(-8);
  panelGroup.rotation.x = THREE.MathUtils.degToRad(-4);
  lamp.add(panelGroup);

  const neck = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.6, 0.2), armMat);
  neck.position.set(0, 0.75, 0.005);
  neck.rotation.z = THREE.MathUtils.degToRad(6);
  neck.userData.key = 'arm';
  arm.add(neck);

  // ---- LED light strip on the underside of the solar panel ----
  const ledStripMat = new THREE.MeshStandardMaterial({
    color:0xfff4cc, emissive:0xffe08a, emissiveIntensity:1.4
  });
  const ledBulbs = [];
  const bulbCols = 6, bulbRows = 2;
  const spanX = 1.7, spanZ = 0.35;
  for(let r=0;r<bulbRows;r++){
    for(let c=0;c<bulbCols;c++){
      const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.055, 16, 16), ledStripMat);
      const x = -spanX/2 + (c/(bulbCols-1)) * spanX;
      const z = -spanZ/2 + (r/(bulbRows-1)) * spanZ;
      bulb.position.set(x, -0.045, z);
      bulb.userData.key = 'solar';
      panelGroup.add(bulb);
      ledBulbs.push(bulb);
    }
  }

  // ---- "ECO GLOW LAMP" text on the base, front and back ----
  function makeLabelTexture(text){
    const canvas = document.createElement('canvas');
    canvas.width = 512; canvas.height = 96;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = '#1a1a1a';
    ctx.font = 'bold 50px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, canvas.width/2, canvas.height/2);
    return new THREE.CanvasTexture(canvas);
  }
  const labelTexture = makeLabelTexture('ECO GLOW LAMP');
  const labelMat = new THREE.MeshBasicMaterial({map: labelTexture, transparent:true});

  const labelFront = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 0.28), labelMat);
  labelFront.position.set(0, 0.25, 0.552);
  lamp.add(labelFront);

  const labelBack = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 0.28), labelMat);
  labelBack.position.set(0, 0.25, -0.552);
  labelBack.rotation.y = Math.PI;
  lamp.add(labelBack);

  lamp.position.y = -1.3;
  scene.add(lamp);

  // ---- interactivity: raycasting for clicks/hover ----
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  const clickable = [base, tray, display, bezel, board, arm, thermoPlate, panelBody, outline, neck, switchBase, toggle, ...ledBulbs];

  function pickAt(clientX, clientY){
    const rect = renderer.domElement.getBoundingClientRect();
    mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(clickable);
    return hits.length ? hits[0].object : null;
  }

  const infocard = document.getElementById('infocard');
  const infoTitle = document.getElementById('info-title');
  const infoBody = document.getElementById('info-body');

  function showInfo(key){
    const d = info[key];
    if(!d) return;
    infoTitle.textContent = d.title;
    infoBody.textContent = d.body;
    infocard.classList.add('show');
  }
  window.closeInfo = function(){ infocard.classList.remove('show'); };

  let downX = 0, downY = 0;
  renderer.domElement.addEventListener('pointerdown', (e) => { downX = e.clientX; downY = e.clientY; });
  renderer.domElement.addEventListener('pointerup', (e) => {
    const moved = Math.abs(e.clientX - downX) + Math.abs(e.clientY - downY);
    if(moved > 6) return; // was a drag, not a tap
    const obj = pickAt(e.clientX, e.clientY);
    if(obj && obj.userData.key) showInfo(obj.userData.key);
  });

  renderer.domElement.addEventListener('pointermove', (e) => {
    const obj = pickAt(e.clientX, e.clientY);
    renderer.domElement.classList.toggle('hoverable', !!(obj && obj.userData.key));
  });

  // ---- LED toggle: light strip under the panel + downward glow ----
  const downLight = new THREE.SpotLight(0xffe08a, 2.2, 6, THREE.MathUtils.degToRad(45), 0.5, 1);
  downLight.position.set(-0.1, 2.15, -0.1);
  const downTarget = new THREE.Object3D();
  downTarget.position.set(-0.1, 0, -0.1);
  lamp.add(downTarget);
  downLight.target = downTarget;
  lamp.add(downLight);

  const deskGlow = new THREE.Mesh(
    new THREE.CircleGeometry(1.1, 32),
    new THREE.MeshBasicMaterial({color:0xffe08a, transparent:true, opacity:0.18})
  );
  deskGlow.rotation.x = -Math.PI / 2;
  deskGlow.position.set(-0.1, 0.01, -0.1);
  lamp.add(deskGlow);

  let ledOn = true;
  const btnLight = document.getElementById('btn-light');
  btnLight.addEventListener('click', () => {
    ledOn = !ledOn;
    downLight.intensity = ledOn ? 2.2 : 0;
    ledStripMat.emissiveIntensity = ledOn ? 1.6 : 0.05;
    deskGlow.visible = ledOn;
    btnLight.textContent = ledOn ? '💡 LED on' : '💡 LED off';
    btnLight.classList.toggle('off', !ledOn);
  });

  // ---- auto-rotate toggle ----
  const btnRotate = document.getElementById('btn-rotate');
  btnRotate.addEventListener('click', () => {
    if(!controls) return;
    controls.autoRotate = !controls.autoRotate;
    btnRotate.textContent = controls.autoRotate ? '⏸ auto-rotate' : '▶ auto-rotate';
    btnRotate.classList.toggle('off', !controls.autoRotate);
  });

  function onResize(){
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }
  window.addEventListener('resize', onResize);

  function animate(){
    requestAnimationFrame(animate);
    if(controls) controls.update();
    renderer.render(scene, camera);
  }
  animate();
});
</script>
</body>
</html>
